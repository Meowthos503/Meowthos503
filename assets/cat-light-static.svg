<title id="cat-title">Meowthos · 小猫歇一会儿</title>
<desc id="cat-desc">Original charcoal pixel kitten with a broad round head, gold and blue eyes and short paws. It rests, blinks, listens, gently bats a little block, stretches, curls up to sleep and wakes in a thirty-second loop. Use the surrounding native fold control to hide the animation; a still companion is offered for reduced motion. This image is not interactive.</desc>
