<title id="desk-title">Meowthos · pixel workbench</title>
<desc id="desk-desc">An original pixel desk with a paper nameplate, half-full glass and a small mechanical toy. The toy sends an ice block toward the glass, catches on the rim, then shifts the glass a little to finish the job. Decorative animation; no live activity, audio or interactive control is implied.</desc>
